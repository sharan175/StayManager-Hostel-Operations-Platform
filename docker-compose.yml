
services:
  frontend:
    build: ./frontend
    container_name: staymanager-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./Backend
    container_name: staymanager-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: "hostel_management "
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: staymanager-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: "hostel_management "
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
