
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: staymanager-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./Backend
    container_name: staymanager-backend
    expose:
      - "3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: "hostel_management "
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://3.27.209.60/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:-mysecret}
      FRONTEND_URL: ${FRONTEND_URL:-http://3.27.209.60}
      BASE_URL: ${BASE_URL:-http://3.27.209.60}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://3.27.209.60}
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: staymanager-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: "hostel_management "
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
